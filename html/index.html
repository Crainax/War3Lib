<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ed">
  <title>海风骑行社 · 鹈鹕的慢旅途</title>
  <style>
    :root { color-scheme: light; --paper:#f7f5ed; --ink:#284c49; --muted:#7c8a7e; --line:#dedfd3; --orange:#dc754e; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
    button,input { font:inherit; }
    button { -webkit-tap-highlight-color:transparent; }
    .page { max-width:1440px; margin:auto; padding:30px 56px 25px; }
    header { display:flex; align-items:center; justify-content:space-between; padding-bottom:24px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:11px; font-size:16px; font-weight:650; letter-spacing:2px; }
    .brand svg { width:35px; height:35px; }
    .edition { font-size:10px; letter-spacing:2.3px; color:var(--muted); }
    .intro { text-align:center; padding:35px 0 28px; }
    .eyebrow { display:flex; align-items:center; justify-content:center; gap:12px; font-size:10px; letter-spacing:3px; color:var(--orange); }
    .eyebrow:before,.eyebrow:after { content:""; width:24px; height:1px; background:#d9a58a; }
    h1 { font-size:clamp(26px,3.1vw,42px); font-weight:500; letter-spacing:5px; margin:15px 0 12px; }
    .intro p { margin:0; font-size:12px; letter-spacing:2px; color:var(--muted); }
    .postcard { position:relative; border-radius:18px; overflow:hidden; background:#e9eee5; border:1px solid #dde3d7; }
    .scene { display:block; width:100%; height:auto; }
    .scene-label { position:absolute; top:25px; left:29px; font-size:10px; letter-spacing:2px; color:#53766c; display:flex; align-items:center; gap:8px; }
    .live-dot { width:5px; height:5px; background:#70977d; border-radius:50%; }
    .scene-number { position:absolute; right:28px; top:25px; font-size:10px; letter-spacing:2px; color:#6e8c7d; }
    .caption { position:absolute; bottom:23px; left:29px; color:#7d8a6b; font-size:10px; letter-spacing:1.8px; }
    .coordinates { position:absolute; bottom:23px; right:29px; color:#7d8a6b; font-size:10px; letter-spacing:1.3px; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:21px 4px; border-bottom:1px solid var(--line); }
    .playback { display:flex; align-items:center; gap:13px; }
    .play { width:42px; height:42px; border-radius:50%; background:var(--ink); color:var(--paper); border:0; cursor:pointer; display:grid; place-items:center; transition:background .2s,transform .2s; }
    .play:hover { background:#3c6a61; transform:scale(1.05); }
    .play svg { width:17px; height:17px; }
    .play .play-symbol { display:none; }
    .play[aria-pressed="true"] .play-symbol { display:block; }
    .play[aria-pressed="true"] .pause-symbol { display:none; }
    .status { font-size:12px; letter-spacing:1px; }
    .status small { display:block; font-size:9px; color:var(--muted); letter-spacing:1.5px; margin-top:5px; }
    .speed { display:flex; align-items:center; gap:14px; font-size:11px; color:#718478; }
    .speed svg { width:18px; height:18px; }
    input[type="range"] { width:130px; height:18px; accent-color:#53796b; cursor:pointer; }
    output { font-size:10px; font-variant-numeric:tabular-nums; min-width:32px; color:var(--ink); }
    .route { display:flex; align-items:center; gap:8px; font-size:11px; color:#728373; letter-spacing:1px; }
    .route svg { width:17px; height:17px; }
    button:focus-visible,input:focus-visible { outline:3px solid #dc9a6b; outline-offset:5px; }
    footer { display:flex; justify-content:space-between; padding-top:21px; font-size:10px; color:#849080; letter-spacing:1.3px; }
    footer .note { display:flex; align-items:center; gap:7px; }
    .note svg { width:14px; height:14px; }
    @media (min-width:1500px) { .page { padding-top:38px; } .intro { padding:43px 0 34px; } }
    @media (max-width:700px) {
      .page { padding:22px 18px; } header { padding-bottom:19px; } .edition { font-size:8px; letter-spacing:1px; }
      .brand { font-size:13px; letter-spacing:1px; gap:7px; } .brand svg { width:28px; }
      .intro { padding:30px 0 24px; } h1 { letter-spacing:2px; } .intro p { font-size:10px; letter-spacing:1px; }
      .scene { width:150%; max-width:none; margin-left:-25%; } .postcard { border-radius:12px; }
      .scene-label { top:17px; left:17px; font-size:8px; } .scene-number { top:17px; right:17px; font-size:8px; }
      .caption { left:17px; bottom:15px; font-size:8px; } .coordinates { display:none; }
      .toolbar { gap:12px; padding:18px 0; flex-wrap:wrap; } .route { display:none; }
      .speed { gap:7px; font-size:10px; } input[type="range"] { width:80px; } .speed svg { display:none; }
      footer { font-size:8px; letter-spacing:.6px; gap:14px; line-height:1.8; } .status { font-size:11px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand">
        <svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="1.3"/><path d="M9 25c5 0 5 3 10 3s5-3 11-3M11 20c4 0 5 2 8 2 4 0 5-2 10-2M17 16c-2-6 7-8 7-3h6l-6 4-1 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        海风骑行社
      </div>
      <span class="edition">THE SLOW CLUB &nbsp; / &nbsp; VOL. 001</span>
    </header>
    <section class="intro" aria-labelledby="title">
      <div class="eyebrow">A PELICAN'S LITTLE ESCAPE</div>
      <h1 id="title">慢一点，海风刚好。</h1>
      <p>跟着鹈鹕去兜风，把时间交给沿途的风景。</p>

            <path d="M421 452 577 459q22-2 23-19t-23-22L421 429q-12 11 0 23Z" stroke="#597664" stroke-width="2.5"/>
          </g>
          <path d="M504 302q9-9 23-6l36 3q9 2 6 8-3 5-18 5h-37q-13 0-10-10Z" fill="#705b47"/>
          <path d="M509 301q20-4 48 2" fill="none" stroke="#aa8d65" stroke-width="2" stroke-linecap="round"/>
          <circle cx="420" cy="440" r="7" fill="#f3ddb3" stroke="#426657" stroke-width="3"/>
          <circle cx="744" cy="440" r="7" fill="#f3ddb3" stroke="#426657" stroke-width="3"/>
          <circle cx="575" cy="440" r="24" fill="#88a38a" stroke="#3e6557" stroke-width="3"/>
          <circle cx="575" cy="440" r="17" fill="none" stroke="#c0cbb0" stroke-width="2" stroke-dasharray="3 5"/>

            <path d="M503 280q-33 2-52-9 17 26 48 31" fill="#f9f7e9"/>
            <path d="M495 270c16-25 52-29 85-20 21 6 32 5 42-12 13-22 5-49 13-75 7-23 24-35 43-30 24 5 31 27 24 44-6 16-24 22-33 37-11 19-6 47-13 70-9 32-35 59-72 65-44 8-88-13-96-40-5-15-2-28 7-39Z" fill="#fbf9ed" stroke="#c4d1bf" stroke-width="2"/>
            <path d="M498 314q39 29 83 18c46-12 57-33 61-67 1 44-24 76-57 83-40 8-76-6-87-34Z" fill="#e4e9d9"/>
            <path d="M665 190q-22 25-19 58" fill="none" stroke="#dfe7d7" stroke-width="7" stroke-linecap="round"/>

  </main>
  <script>
    'use strict';
    const byId = id => document.getElementById(id);
    const parts = Object.fromEntries(['wheel-back','wheel-front','crank','leg-back','leg-front','foot-back','foot-front','pelican','rider-bike','scarf-tail','clouds','waves','road','plants','boat','shadow'].map(id => [id, byId(id)]));
    const toggle = byId('toggle');
    const speedInput = byId('speed');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let playing = !reducedMotion.matches;
    let speed = 1;
    let elapsed = 0;
    let previous = null;
    const TAU = Math.PI * 2;
    const cycle = 2.4;
    const setTransform = (id, value) => parts[id].setAttribute('transform', value);

    // Analytical two-bone IK: constant bone lengths, with feet locked to the pedals.
    function leg(side, angle, bob) {
      const hip = { x:579, y:332 + bob };
      const pedal = { x:575 + Math.cos(angle) * 33, y:440 + Math.sin(angle) * 33 };
      const ankle = { x:pedal.x, y:pedal.y - 8 };
      const dx = ankle.x - hip.x, dy = ankle.y - hip.y;
      const distance = Math.hypot(dx, dy);
      const upper = 81, lower = 78;
      const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
      const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
      const knee = { x:hip.x + along * dx / distance + bend * dy / distance, y:hip.y + along * dy / distance - bend * dx / distance };
      parts['leg-' + side].setAttribute('d', `M${hip.x} ${hip.y} Q${hip.x + 6} ${hip.y + 12} ${knee.x} ${knee.y} L${ankle.x} ${ankle.y}`);
      setTransform('foot-' + side, `translate(${pedal.x} ${pedal.y - 8})`);
    }

    function render(time) {
      const angle = (time / cycle % 1) * TAU;
      const degrees = angle * 180 / Math.PI;
      const bob = Math.sin(angle * 2) * 2.2;
      const travel = time * (TAU * 96 / cycle * 1.6);
      const wheelAngle = (time / cycle * 360 * 1.6) % 360;
      setTransform('wheel-back', `rotate(${wheelAngle})`);
      setTransform('wheel-front', `rotate(${wheelAngle})`);
      setTransform('crank', `translate(575 440) rotate(${degrees})`);
      leg('back', angle + Math.PI, bob);
      leg('front', angle, bob);
      setTransform('pelican', `translate(0 ${bob})`);
      setTransform('rider-bike', `translate(0 ${Math.sin(angle * 2 + .5) * .65})`);
      setTransform('scarf-tail', `rotate(${Math.sin(angle * 2) * 4} 640 229)`);
      setTransform('road', `translate(${-travel % 1200} 550)`);
      setTransform('plants', `translate(${-travel % 1200} 0)`);
      setTransform('waves', `translate(${-(travel * .13) % 1200} 325)`);
      setTransform('clouds', `translate(${-(travel * .025) % 1200} 0)`);
      setTransform('boat', `translate(1007 ${308 + Math.sin(time * 1.2) * 1.5}) rotate(${Math.sin(time * 1.2) * 1.5})`);
      parts.shadow.setAttribute('rx', 248 + bob);
    }

    function syncControls() {
      toggle.setAttribute('aria-pressed', String(!playing));
      toggle.setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
      byId('status-text').textContent = playing ? '正在悠闲骑行' : '停下来，看看海';
      document.querySelector('.live-dot').style.background = playing ? '#70977d' : '#b5b59d';
    }
    toggle.addEventListener('click', () => { playing = !playing; previous = null; syncControls(); });
    speedInput.addEventListener('input', () => {
      speed = Number(speedInput.value);
      byId('speed-value').textContent = speed.toFixed(1) + ' ×';
      speedInput.setAttribute('aria-valuetext', speed.toFixed(1) + ' 倍速度');
    });
    reducedMotion.addEventListener('change', event => { playing = !event.matches; previous = null; syncControls(); });
    document.addEventListener('visibilitychange', () => { previous = null; });
    function frame(now) {
      if (playing && !document.hidden && previous !== null) {
        elapsed += Math.min((now - previous) / 1000, .05) * speed;
        render(elapsed);
      }
      previous = now;
      requestAnimationFrame(frame);
    }
    render(0);
    syncControls();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
